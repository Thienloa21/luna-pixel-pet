<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Добавить персонажа — Луна</title>
  <link rel="stylesheet" href="popup.css">
  <script src="atlas.js" defer></script>
  <script src="pet.js" defer></script>
  <script src="import.js" defer></script>
</head>
<body class="character-page">
  <main>
    <h1>Добавить своего персонажа</h1>
    <p>Нужен прозрачный PNG размером 1536 × 576 пикселей. Расположите 20 кадров в том же порядке, что и в шаблоне Луны.</p>
    <div class="downloads">
      <a href="assets/luna-sprites.png" download="luna-sprites.png">Скачать шаблон Луны</a>
      <a href="assets/sprite-guide.txt" download="sprite-guide.txt">Промпт для ИИ</a>
    </div>
    <form id="import-character">
      <label for="character-name">Имя</label>
      <input id="character-name" type="text" maxlength="40" placeholder="Имя персонажа" required>
      <label for="character-file">Спрайт-лист PNG</label>
      <input id="character-file" type="file" accept="image/png,.png" required>
      <button id="import-button" type="submit" disabled>Загрузить персонажа</button>
    </form>
    <p id="import-status" role="status"></p>
  </main>
</body>
</html>
