<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Луна</title>
  <link rel="stylesheet" href="popup.css">
  <script src="atlas.js" defer></script>
  <script src="pet.js" defer></script>
  <script src="import.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Луна</h1>
      <label class="switch" title="Показывать питомца">
        <input id="enabled" type="checkbox" aria-label="Показывать питомца" disabled>
        <span aria-hidden="true"></span>
      </label>
    </header>
    <div class="stage" aria-hidden="true">
      <div class="moon"></div>
      <canvas id="portrait" width="96" height="96"></canvas>
      <div class="pedestal"></div>
    </div>
    <label class="setting" for="character">
      <span>Персонаж</span>
      <select id="character" disabled></select>
    </label>
    <details class="library">
      <summary>Добавить своего персонажа</summary>
      <p>Используйте шаблон Луны как референс для ИИ. Нужен прозрачный PNG 1536 × 576 с 20 кадрами в том же порядке.</p>
      <div class="downloads">
        <a href="assets/luna-sprites.png" download="luna-sprites.png">Скачать шаблон Луны</a>
        <a href="assets/sprite-guide.txt" download="sprite-guide.txt">Промпт для ИИ</a>
      </div>
      <form id="import-character">
        <label for="character-name">Имя</label>
        <input id="character-name" type="text" maxlength="40" placeholder="Имя персонажа" required>
        <label for="character-file">Спрайт-лист PNG</label>
        <input id="character-file" type="file" accept="image/png,.png" required>
        <button id="import-button" type="submit" disabled>Добавить персонажа</button>
      </form>
    </details>
    <button id="remove-character" type="button" hidden>Удалить импортированного персонажа</button>
    <fieldset id="controls" disabled>
      <legend class="sr-only">Настройки питомца</legend>
      <div class="actions">
        <button type="button" data-action="jump">Прыгни</button>
        <button type="button" data-action="sit">Сядь</button>
        <button type="button" data-action="sleep">Спи</button>
      </div>
      <label class="setting" for="size">
        <span>Размер</span>
        <select id="size">
          <option value="1">Маленький · 96 px</option>
          <option value="2">Средний · 144 px</option>
          <option value="3">Большой · 192 px</option>
        </select>
      </label>
      <label class="setting switch" for="roam">
        <span>Гуляет сама</span>
        <input id="roam" type="checkbox">
        <span aria-hidden="true"></span>
      </label>
    </fieldset>
    <p id="status" role="status">Нажмите на питомца или перетащите его по странице.</p>
  </main>
</body>
</html>
